---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: vpc-admin
rules:
# To create the admin policy
- verbs:
  - "*"
  apiGroups:
  - policy.networking.k8s.io
  resources:
  - adminnetworkpolicies
# To create cluster resource quota
- verbs:
  - "*"
  apiGroups:
  - quota.openshift.io
  resources:
  - clusterresourcequotas
# To create OVN egressIP
- verbs:
  - "*"
  apiGroups:
  - k8s.ovn.org
  resources:
  - egressips
# To create Cilium network policies
- verbs:
  - "*"
  apiGroups:
  - cilium.io
  resources:
  - ciliumnetworkpolicy
  - ciliumclusterwidenetworkpolicies