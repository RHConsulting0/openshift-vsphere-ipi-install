---
applicationSetManagedByArgoCDNamespace: openshift-gitops

applicationSetDefaults:
  componentLabel: cluster-management
  partOfLabel: platform-management
  argoCDProject: cluster-management
  syncPolicyAutomated: true
  preventCascadingDeletion: false

applicationSetGitSources:
# cluster specific capabilities
- name: cluster-lab
  repoURL: https://github.com/RHConsulting0/openshift-vsphere-ipi-install.git
  revision: automation
  path: clusters/labhub/capabilities/*/kustomization.yaml

# group-all capabilities
- name: group-all
  repoURL: https://github.com/RHConsulting0/openshift-vsphere-ipi-install.git
  revision: automation
  path: groups/kustomize/groups/all/capabilities/*/kustomization.yaml

# group-hub capabilities
- name: group-hub
  repoURL: https://github.com/RHConsulting0/openshift-vsphere-ipi-install.git
  revision: automation
  path: groups/kustomize/groups/hub/capabilities/*/kustomization.yaml

# group-hub-protected capabilities
- name: group-hub-protected
  repoURL: https://github.com/RHConsulting0/openshift-vsphere-ipi-install.git
  revision: automation
  path: groups/kustomize/groups/hub-protected/capabilities/*/kustomization.yaml
  preventCascadingDeletion: true

# managed clusters configuration
- name: managed-clusters
  repoURL: https://github.com/RHConsulting0/openshift-vsphere-ipi-install.git
  revision: automation
  path: clusters/labhub/managed-clusters/*/kustomization.yaml
