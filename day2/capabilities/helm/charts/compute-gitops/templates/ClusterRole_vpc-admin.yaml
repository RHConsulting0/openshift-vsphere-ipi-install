
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: vpc-admin
rules:
# To create the admin policy
- verbs:
  - "*"
  apiGroups:
  - policy.networking.k8s.io
  resources:
  - adminnetworkpolicies
# To create cluster resource quota
- verbs:
  - "*"
  apiGroups:
  - quota.openshift.io
  resources:
  - clusterresourcequotas
# To create OVN egressIP
- verbs:
  - "*"
  apiGroups:
  - k8s.ovn.org
  resources:
  - egressips
# To create Cilium network policies
- verbs:
  - "*"
  apiGroups:
  - cilium.io
  resources:
  - ciliumnetworkpolicy
  - ciliumclusterwidenetworkpolicies
  - ciliumnetworkpolicies
# To manage secrets for JPMC test suite 
- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - ""
  resources:
  - Secret
  - secrets
  - Service
  - services
  - ServiceAccount
  - ServiceAccounts
  - ConfigMap
  - ConfigMaps
- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - argoproj.io
  resources:
  - ArgoCD
  - argocds

- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - RoleBinding
  - RoleBindings
  - ClusterRole
  - ClusterRoles
  - ClusterRoleBinding
  - ClusterRoleBindings

- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - user.openshift.io
  resources:
  - Group
  - groups

- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - apps.openshift.io
  resources:
  - DeploymentConfig
  - deploymentconfigs

- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - build.openshift.io
  resources:
  - BuildConfig
  - buildconfigs

- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - image.openshift.io
  resources:
  - ImageStream
  - imagestreams

- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - route.openshift.io
  resources:
  - routes

- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - apps
  resources:
  - Deployment
  - deployments

- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - gateway.networking.k8s.io
  resources:
  - Gateway
  - gateways
  - HTTPRoute
  - httproutes
  - ReferenceGrant
  - referencegrants

- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - kafka.strimzi.io
  resources:
  - Kafka
  - Kafkas

- verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
  apiGroups:
  - apiextensions.k8s.io
  resources:
  - CustomResourceDefinition
  - CustomResourceDefinitions