apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  annotations:
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    release.openshift.io/create-only: "true"
  name: cluster
spec:
  identityProviders:
  - ldap:
      attributes:
        email:
        - mail
        id:
        - dn
        name:
        - cn
        preferredUsername:
        - uid
      bindDN: uid=openshift,cn=sysaccounts,cn=etc,dc=rh,dc=wwtpoc,dc=local
      bindPassword:
        name: ldap-bind-password
      ca:
        name: ldap-ca
      insecure: false
      url: ldaps://rhel9-01.rh.wwtpoc.local/cn=users,cn=accounts,dc=rh,dc=wwtpoc,dc=local?uid?sub?(&(objectClass=organizationalPerson))
    mappingMethod: claim
    name: ldap
    type: LDAP
