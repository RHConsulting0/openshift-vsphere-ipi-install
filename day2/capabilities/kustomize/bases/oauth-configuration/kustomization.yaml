---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./oauth-cluster.yaml
  - ./eso-ldap-bind-config.yaml

generatorOptions:
  disableNameSuffixHash: true

# LDAP CA
configMapGenerator:
  # TODO: Make sure to generate this with standard hash prefix.
  - name: ldap-ca
    namespace: openshift-config
    files:
      - ca.crt=ldap_ca.pem

  # # For HCP
  # - name: ldap-ca
  #   namespace: openshift-authentication
  #   files:
  #     - ca.crt=ldap_ca.pem

# If not saved in Vault use following. (For production, secrets should come from ESO / VaultConfig.)
