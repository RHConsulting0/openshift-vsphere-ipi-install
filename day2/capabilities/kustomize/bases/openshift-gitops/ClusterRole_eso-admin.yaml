---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: eso-sa
rules:
- verbs:
  - "*"
  apiGroups:
  - "external-secrets.io"
  resources:
  - clustersecretstores
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: runner-sa
rules:
- verbs:
  - "*"
  apiGroups:
  - "external-secrets.io"
  resources:
  - externalsecrets
- verbs:
  - "*"
  apiGroups:
  - "apps.gitlab.com"
  resources:
  - runners