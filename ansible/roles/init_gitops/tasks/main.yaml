---
- name: Pre-inject ESO vault access secret
  when: vault_service.use_vault
  kubernetes.core.k8s:
    state: present
    template: "day2/.init/configure-eso.j2.yaml"

- name: Install OpenShift GitOps operator
  kubernetes.core.k8s:
    definition: |
      {{ lookup('kubernetes.core.kustomize',
                dir='day2/.init/' + managing_cluster.foundation_cluster + '/openshift-gitops-operator',
                enable_helm=True) }}
    wait: true
    wait_timeout: 600
  register: install_openshift_gitops_operator_result

- name: Install OpenShift GitOps operator result output (enable -v to see)
  ansible.builtin.debug:
    var: install_openshift_gitops_operator_result
    verbosity: 1

- name: Wait for CRD established | ArgoCD
  kubernetes.core.k8s_info:
    kind: CustomResourceDefinition
    api_version: apiextensions.k8s.io/v1
    name: argocds.argoproj.io
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Established
      status: true
      reason: InitialNamesAccepted

- name: Wait for CRD established | Application
  kubernetes.core.k8s_info:
    kind: CustomResourceDefinition
    api_version: apiextensions.k8s.io/v1
    name: applications.argoproj.io
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Established
      status: true
      reason: InitialNamesAccepted

- name: Wait for Namespace | openshift-gitops
  kubernetes.core.k8s_info:
    kind: Namespace
    api_version: v1
    name: openshift-gitops
    wait: true
    wait_timeout: 300

# install ACM/MCH/OCM!!
- name: Configure cluster OpenShift GitOps (ArgoCD)
  kubernetes.core.k8s:
    definition: |
      {{ lookup('kubernetes.core.kustomize',
                dir='day2/.init/' + managing_cluster.foundation_cluster + '/openshift-gitops',
                enable_helm=True) }}
    wait: true
  register: configure_cluster_openshift_gitops

# ACM and MCH should be installed!!!!

- name: Configure cluster OpenShift GitOps (ArgoCD) result output (enable -v to see)
  ansible.builtin.debug:
    var: configure_cluster_openshift_gitops
    verbosity: 1

- name: Wait for ArgoCD AppProjects
  kubernetes.core.k8s_info:
    kind: AppProject
    api_version: argoproj.io/v1alpha1
    name: "{{ appproject }}"
    namespace: openshift-gitops
    wait: true
    wait_timeout: 180                # Initially 300
  loop:
    - cluster-management
  loop_control:
    loop_var: appproject

# ADD WAIT for ACM, MCH, OCM

- name: Wait for ACM operator to be installed and running
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: open-cluster-management
    label_selectors:
      - app=multicluster-operators-subscription
  register: acm_deployments
  until:
    - acm_deployments.resources | length > 0
    - acm_deployments.resources[0].status.readyReplicas | default(0) > 0
    - acm_deployments.resources[0].status.conditions |
      selectattr('type', 'equalto', 'Available') |
      selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 30
  delay: 30
  failed_when: false

- name: Verify ACM operator is running successfully
  assert:
    that:
      - acm_deployments.resources | length > 0
      - acm_deployments.resources[0].status.readyReplicas | default(0) > 0
      - acm_deployments.resources[0].status.conditions |
        selectattr('type', 'equalto', 'Available') |
        selectattr('status', 'equalto', 'True') | list | length > 0
    fail_msg: "ACM operator failed to start after 15 minutes (30 retries × 30 seconds)"
    success_msg: "ACM operator is installed and running successfully"

- name: Install Application to initialize gitops reconciliation loop
  kubernetes.core.k8s:
    definition: |
      {{ lookup('kubernetes.core.kustomize',
                dir='day2/.init/' + managing_cluster.foundation_cluster + '/foundation-cluster-management-root-application',
                enable_helm=True) }}
    wait: true
  register: install_application_result

- name: Install Application result output (enable -v to see)
  ansible.builtin.debug:
    var: install_application_result
    verbosity: 1

- name: Label ManagedCluster (local-cluster) with apply-gitops=true
  kubernetes.core.k8s:
    definition:
      apiVersion: cluster.open-cluster-management.io/v1
      kind: ManagedCluster
      metadata:
        name: local-cluster
        labels:
          apply-gitops: "true"
    wait: true

- name: Wait for ArgoCD Applications in openshift-gitops to be healthy and synced (10 second delay between attempts, time out at 20 minutes)
  kubernetes.core.k8s_info:
    kind: Application
    api_version: argoproj.io/v1alpha1
    namespace: openshift-gitops
  register: applications
  retries: 120
  delay: 10
  until: >-
    (
      (
        applications.resources |
        rejectattr('status.health.status', 'defined') |
        map(attribute='metadata') |
        map(attribute='name') |
        list
      ) +
      (
        applications.resources |
        selectattr('status.health.status', 'defined') |
        rejectattr('status.health.status', 'eq', 'Healthy') |
        map(attribute='metadata') |
        map(attribute='name') |
        list
      ) +
      (
        applications.resources |
        rejectattr('status.sync.status', 'defined') |
        map(attribute='metadata') |
        map(attribute='name') |
        list
      ) +
      (
        applications.resources |
        selectattr('status.sync.status', 'defined') |
        rejectattr('status.sync.status', 'eq', 'Synced') |
        map(attribute='metadata') |
        map(attribute='name') |
        list
      )
    ) |
    length == 0
  failed_when: false

- name: Get list of ArgoCD Applications in openshift-gitops that are still not healthy and synced
  ansible.builtin.set_fact:
    unhealthy_applications: >-
      {{
        (
          (
            applications.resources |
            rejectattr('status.health.status', 'eq', 'Healthy') |
            map(attribute='metadata') |
            map(attribute='name') |
            list
          ) +
          (
            applications.resources |
            rejectattr('status.sync.status', 'eq', 'Synced') |
            map(attribute='metadata') |
            map(attribute='name') |
            list
          )
        )
      }}

- name: Verify after waiting all ArgoCD Applications in openshift-gitops are healthy and synced
  ansible.builtin.assert:
    that:
      unhealthy_applications | length == 0
    quiet: false
    fail_msg: "Failed due to ArgoCD Applications in openshift-gitops still not being healthy and synced: {{ unhealthy_applications }}"
    success_msg: "All ArgoCD Applications in openshift-gitops are healthy and synced"
