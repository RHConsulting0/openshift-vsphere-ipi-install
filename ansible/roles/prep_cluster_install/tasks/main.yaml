---
- name: Get user information
  ansible.builtin.setup:
    filter: ansible_user*

- name: Debug current user context
  ansible.builtin.debug:
    msg:
      - "Current user: {{ ansible_user_id }}"
      - "Current group: {{ ansible_user_gid }}"

- name: Confirm the tmpdir
  block:

    - name: Check for tmpdir directory
      ansible.builtin.stat:
        path: "/runner/project/tmpdir"
      register: tmpdir

    - name: Fail if tmpdir does not exist
      ansible.builtin.fail:
        msg:
          - "tmpdir directory does not exist"
          - "Please resolve the missing directory and contents"
      when: tmpdir is not defined


- name: Prepare the pull-secret
  block:
    - name: Check for secrets directory
      ansible.builtin.stat:
        path: "/runner/project/secrets"
      register: ocp_secrets

    - name: Fail if ocp_secrets does not exist
      ansible.builtin.fail:
        msg:
          - "secrets directory does not exist"
          - "Please resolve the missing directory and contents"
      when: ocp_secrets is not defined

# Read secrets files into variables
- name: Read pull-secret.json (plain text)
  ansible.builtin.slurp:
    src: "{{ pull_secret_json_file }}"
  register: pull_secret_raw

- name: Read the SSH public key file (plain text)
  ansible.builtin.slurp:
    src: "{{ ssh_pub_file }}"
  register: ssh_pub

- name: Read vsphere password (plain text)
  ansible.builtin.slurp:
    src: "{{ vsphere_password_file }}"
  register: vsphere_password_raw

- name: Read trust bundle (plain text)
  ansible.builtin.slurp:
    src: "{{ additional_trust_bundle_file }}"
  register: trust_bundle_raw

- name: Ensure required variables are defined
  ansible.builtin.assert:
    that:
      - pull_secret_raw.content is defined and pull_secret_raw.content | length > 0
      - ssh_pub.content is defined and ssh_pub.content | length > 0
      - vsphere_password_raw.content is defined and vsphere_password_raw.content | length > 0
      - trust_bundle_raw.content is defined and trust_bundle_raw.content | length > 0
    fail_msg: >
      "One or more required secrets (pull_secret_raw.content, ssh_pub.content, vsphere_password_raw.content, trust_bundle_raw.content) are undefined or empty"
  run_once: true

- name: Debug pull_secret_raw.content
  ansible.builtin.debug:
    msg: "pull_secret_raw.content (base64): {{ pull_secret_raw.content | default('UNDEFINED') }}"
  when: ansible_verbosity >= 2
  run_once: true

- name: Debug ssh_pub.content
  ansible.builtin.debug:
    msg: "ssh_pub.content (base64): {{ ssh_pub.content | default('UNDEFINED') }}"
  when: ansible_verbosity >= 2
  run_once: true

- name: Debug vsphere_password_raw.content
  ansible.builtin.debug:
    msg: "vsphere_password_raw.content (base64): {{ vsphere_password_raw.content | default('UNDEFINED') }}"
  when: ansible_verbosity >= 2
  run_once: true

- name: Debug trust_bundle_raw.content
  ansible.builtin.debug:
    msg: "trust_bundle_raw.content (base64): {{ trust_bundle_raw.content | default('UNDEFINED') }}"
  when: ansible_verbosity >= 2
  run_once: true

- name: Debug decoded pull secret
  ansible.builtin.debug:
    msg: "pull_secret_decoded: {{ pull_secret_raw.content | b64decode | default('INVALID_BASE64', true) }}"
  when: ansible_verbosity >= 2
  run_once: true

- name: Debug decoded ssh key
  ansible.builtin.debug:
    msg: "ssh_key_decoded: {{ ssh_pub.content | b64decode | trim | default('INVALID_BASE64', true) }}"
  when: ansible_verbosity >= 2
  run_once: true

- name: Debug decoded vsphere password
  ansible.builtin.debug:
    msg: "vsphere_password_decoded: {{ vsphere_password_raw.content | b64decode | trim | default('INVALID_BASE64', true) }}"
  when: ansible_verbosity >= 2
  run_once: true

- name: Debug decoded ca bundle
  ansible.builtin.debug:
    msg: "ca_bundle_decoded: {{ trust_bundle_raw.content | b64decode | default('INVALID_BASE64', true) }}"
  when: ansible_verbosity >= 2
  run_once: true

- name: Debug pull secret JSON
  ansible.builtin.debug:
    msg: "pull_secret_json: {{ (pull_secret_raw.content | b64decode | from_json | default('INVALID_JSON', true)) }}"
  when: ansible_verbosity >= 2
  run_once: true

- name: Build combined YAML dictionary (secrets file)
  ansible.builtin.set_fact:
    combined_dict:
      pullSecret: "{{ pull_secret_raw.content | b64decode | from_json | to_json }}"
      sshKey: "{{ ssh_pub.content | b64decode | trim }}"
      vspherePassword: "{{ vsphere_password_raw.content | b64decode | trim }}"
      caBundle: "{{ trust_bundle_raw.content | b64decode }}"
  run_once: true

- name: Assert combined_dict is a dictionary
  ansible.builtin.assert:
    that:
      - combined_dict is mapping
    fail_msg: "combined_dict is NOT a dictionary — check how it’s being built."
    success_msg: "combined_dict is a valid dictionary."

