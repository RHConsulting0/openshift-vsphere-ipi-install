---
- name: Prepare the pull-secret
  block:
    - name: Check for secrets directory
      ansible.builtin.stat:
        path: "/runner/project/secrets"
      register: ocp_secrets

    - name: Fail if ocp_secrets does not exist
      ansible.builtin.fail:
        msg:
          - "secrets directory does not exist"
          - "Please resolve the missing directory and contents"
      when: ocp_secrets is not defined

- name: Read pull-secret.json (plain text)
  ansible.builtin.slurp:
    src: "{{ pull_secret_json_file }}"
  register: pull_secret_raw

- name: Read the SSH public key file
  ansible.builtin.slurp:
    src: "{{ ssh_pub_file }}"
  register: ssh_pub

- name: Print the raw pull-secret content for debugging
  ansible.builtin.debug:
    var: pull_secret_raw
  when: pull_secret_raw is defined

- name: Build combined YAML content (pullSecret + sshKey)
  set_fact:
    combined_yaml: |
      pullSecret: |
        {{ pull_secret_raw.content | b64decode }}
      sshKey: "{{ ssh_pub.content | b64decode | trim }}"

- name: Debug - show combined YAML length
  ansible.builtin.debug:
    msg: "Combined YAML length: {{ combined_yaml | length }} characters"

- name: Ensure target directory exists and is writable by a specific user
  ansible.builtin.file:
    path: "{{ secrets_lab_dir }}"
    state: directory
    owner: "root"
    mode: '0755'
  become: false

# - name: Set permissions on the secrets file
#   ansible.builtin.file:
#     path: "{{ secrets_yaml_file }}"
#     mode: '0644' # Owner can read and write, others can only read
#   become: false

- name: Write secrets_yaml_file directly (plaintext temporarily)
  ansible.builtin.copy:
    dest: "{{ secrets_yaml_file }}"
    content: "{{ combined_yaml }}"
    mode: '0644'

- name: Debug - confirm file written
  ansible.builtin.stat:
    path: "{{ secrets_yaml_file }}"
  register: file_stat

- name: Debug - file size
  ansible.builtin.debug:
    msg: "Plaintext YAML file size: {{ file_stat.stat.size }} bytes"

- name: Encrypt secrets_yaml_file with Ansible Vault and remove plaintext after
  ansible.builtin.command:
    cmd: >
      ansible-vault encrypt {{ secrets_yaml_file }} --vault-password-file {{ vault_password_file }}
  args:
    removes: "{{ secrets_yaml_file }}"
  register: encrypt_result
  changed_when: encrypt_result.rc == 0

- name: Print confirmation of secrets.yaml encryption
  ansible.builtin.debug:
    msg: "secrets.yaml has been encrypted with ansible-vault."
  when: secrets_yaml_file is defined
