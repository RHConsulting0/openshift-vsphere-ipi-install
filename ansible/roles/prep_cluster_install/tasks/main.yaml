---
- name: Get user information
  ansible.builtin.setup:
    filter: ansible_user*

- name: Debug current user context
  ansible.builtin.debug:
    msg:
      - "Current user: {{ ansible_user_id }}"
      - "Current group: {{ ansible_user_gid }}"

- name: Confirm the tmpdir
  block:


    - name: Check for tmpdir directory
      ansible.builtin.stat:
        path: "/runner/project/tmpdir"
      register: tmpdir

    - name: Fail if tmpdir does not exist
      ansible.builtin.fail:
        msg:
          - "tmpdir directory does not exist"
          - "Please resolve the missing directory and contents"
      when: tmpdir is not defined


- name: Prepare the pull-secret
  block:
    - name: Check for secrets directory
      ansible.builtin.stat:
        path: "/runner/project/secrets"
      register: ocp_secrets

    - name: Fail if ocp_secrets does not exist
      ansible.builtin.fail:
        msg:
          - "secrets directory does not exist"
          - "Please resolve the missing directory and contents"
      when: ocp_secrets is not defined

- name: Read pull-secret.json (plain text)
  ansible.builtin.slurp:
    src: "{{ pull_secret_json_file }}"
  register: pull_secret_raw

- name: Read the SSH public key file
  ansible.builtin.slurp:
    src: "{{ ssh_pub_file }}"
  register: ssh_pub

- name: Print the raw pull-secret content for debugging
  ansible.builtin.debug:
    var: pull_secret_raw
  when: pull_secret_raw is defined

- name: Build combined YAML content (pullSecret + sshKey)
  set_fact:
    combined_yaml: |
      pullSecret: |
        {{ pull_secret_raw.content | b64decode | from_json | to_json }}
      sshKey: "{{ ssh_pub.content | b64decode | trim }}"

- name: Debug - show combined YAML length
  ansible.builtin.debug:
    msg: "Combined YAML length: {{ combined_yaml | length }} characters"

- name: Check current permissions for {{ secrets_lab_dir }}
  ansible.builtin.stat:
    path: "{{ secrets_lab_dir }}"
  register: file_stat

- name: Debug permissions for {{ secrets_lab_dir }}
  ansible.builtin.debug:
    msg: "Current permissions: {{ file_stat.stat.mode }}, Owner: {{ file_stat.stat.uid }}, Group: {{ file_stat.stat.gid }}"

- name: Ensure target directory exists and is writable
  ansible.builtin.file:
    path: "{{ secrets_lab_dir }}"
    state: directory
    mode: '0775'
    # # Don't set owner - let it inherit from current user/container
  become: false

# - name: Stat the file first
#   ansible.builtin.stat:
#     path: /host/mount/target.conf
#   register: target_stat
#   ignore_errors: yes

# - name: Write template with same ownership
#   ansible.builtin.template:
#     src: mytemplate.j2
#     dest: /host/mount/target.conf
#     owner: "{{ target_stat.stat.pw_name | default(omit) }}"
#     group: "{{ target_stat.stat.gr_name | default(omit) }}"
#     mode: "{{ target_stat.stat.mode | default('0644') }}"

- name: Write secrets_yaml_file directly (plaintext temporarily)
  ansible.builtin.copy:
    dest: "{{ secrets_yaml_file }}"
    content: "{{ combined_yaml }}"
    owner: "{{ ansible_user_id }}"
    mode: '0644'

- name: Debug - confirm file written
  ansible.builtin.stat:
    path: "{{ secrets_yaml_file }}"
  register: file_stat

- name: Debug - file size
  ansible.builtin.debug:
    msg: "Plaintext YAML file size: {{ file_stat.stat.size }} bytes"

- name: Encrypt secrets_yaml_file with Ansible Vault and remove plaintext after
  ansible.builtin.shell:
    cmd: |
      ansible-vault encrypt {{ secrets_yaml_file }} --vault-password-file {{ vault_password_file }};
      chmod 660 {{ secrets_yaml_file }}
  register: encrypt_result
  changed_when: encrypt_result.rc == 0

- name: Print confirmation of secrets.yaml encryption
  ansible.builtin.debug:
    msg: "secrets.yaml has been encrypted with ansible-vault."
  when: secrets_yaml_file is defined
