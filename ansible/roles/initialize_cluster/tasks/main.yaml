---
- name: Ensure openshift-install exists on host with version 4.10
  block:
    - name: Check for openshift-install
      ansible.builtin.stat:
        path: "/usr/local/bin/openshift-install"
      register: ocs_install

    - name: Fail if ocs_install does not exist
      ansible.builtin.fail:
        msg:
          - "Openshift install command is not installed"
          - "Please install at least version 4.18.x"
      when: ocs_install is not defined

- name: Clean up existing install-dir
  ansible.builtin.file:
    path: "{{ playbook_dir }}/install-dir"
    state: absent

- name: Create bin, install-dir and downloads folders
  ansible.builtin.file:
    path: "{{ playbook_dir }}/install-dir"
    state: directory
    mode: '0755'

# --- Pull-secret Handling ---
- name: Pull-secret tasks
  block:
    - name: Include and decrypt pull-secret.json
      include_vars:
        file: "{{ playbook_dir }}/ansible/secrets/lab/pull-secret.json"
        name: pull_secret
    - name: Parse pull-secret JSON
      set_fact:
        pull_secret_json: "{{ pull_secret | from_json }}"
    - name: Validate pull-secret contains 'auths' key
      assert:
        that:
          - "'auths' in pull_secret_json"
        fail_msg: "Error: pull-secret.json does not contain required 'auths' key."

# --- SSH Key Handling ---
- name: SSH key tasks
  block:
    - name: Include and decrypt SSH public key
      include_vars:
        file: "{{ playbook_dir }}/ansible/secrets/lab/id_ed25519.pub"
        name: ssh_key
    - name: Trim SSH key
      set_fact:
        ssh_key: "{{ ssh_key | trim }}"
    - name: Validate SSH key format
      assert:
        that:
          - ssh_key.startswith("ssh-ed25519")
        fail_msg: "Error: SSH key in id_ed25519.pub does not start with 'ssh-ed25519'."

- name: Create install-config file from template
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/initialize_cluster/templates/install-config.yaml.j2"
    dest: "{{ playbook_dir }}/install-dir/install-config.yaml"
    mode: '0644'

- name: Backup the install-config.yaml file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/install-dir/install-config.yaml"
    dest: "{{ playbook_dir }}/install-dir/install-config.yaml.orig"
    mode: '0664'

# TODO make the log level a variable/parameter
- name: Initialize IPI Cluster installation
  ansible.builtin.command: "/usr/local/bin/openshift-install create cluster --dir={{ playbook_dir }}/install-dir --log-level={{ log_level }}"
  changed_when: false
