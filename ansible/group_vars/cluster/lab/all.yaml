cluster: "lab"                # used in Argo CD, jinja2 templates, 
# cluster_abr: "LAB"          # used in Argo CD paths - this will be handled in GitOps later

# secrets and keys
pull_secret_json_file: "/runner/all-clusters-resources/pull-secret.json"
ssh_pub_file: "/runner/project/secrets/lab/id_ed25519_odfl.pub"
vsphere_password_file: "/runner/all-clusters-resources/lab/vsphere-password.txt"
additional_trust_bundle_file: "/runner/all-clusters-resources/lab/ca-bundle.crt"
secrets_lab_dir: "/runner/project/secrets/lab"
secrets_yaml_file: "/runner/project/secrets/lab/secrets.yaml"
vault_password_file: "/runner/all-clusters-resources/vault-password.txt"   # adjust as needed
secrets: "{{ lookup ('file', secrets_yaml_file) | from_yaml }}"

# OpenShift install config settings

# ODFL environment
proxy_config:
  http_proxy: "http://group-vars-customer.com:8080"
  https_proxy: "http://groups-vars-customer.com:8080"
  no_proxy: "group-vars-customer.com"
additional_trust_bundle_policy: "Always"


# vSphere Platform Configuration
platform_vsphere:
  # vm is a hidden element in the below path and is required to work
  api_vips:
    - "10.0.0.0"
  ingress_vips:
    - "10.0.0.1"
  failure_domain:
    name: "generated-failure-domain"
    region: "generated-region"  
    server: "dc1-p-a-vcenter1.corp.yyzz.com"
    topology:
      compute_cluster: "/DC1-Chicago/host/DC1-ESX-LINUX-NONPROD-CLUSTER1"
      data_center: "DC1-Chicago"
      datastore: "/DC1-Chicago/datastore/DC1-NFS01-ESX-REDHAT-NONPROD-DS1"
      networks:
        - "QA-LINUX-NONPROD"
      resource_pool: "/DC1-Chicago/host/DC1-ESX-LINUX-NONPROD-CLUSTER1/Resources"
    zone: "generated-zone"
  vcenters:
  - datacenters:
    - "DC1-Chicago"  
    port: 443
    server: "dc1-p-a-vcenter1.corp.yyzz.com"
    user: "corp\\svccldvm01"


install_config:
  cluster_name: cluster-9gzgf
  ocp_install_ver: 4.18.23
  base_domain: dynamic.redhatworkshops.io
  # Change IP's per customer
  network:
    cluster_network:
      cidr: 10.128.0.0/14
    service_network: 172.30.0.0/16
    machine_network: 10.7.0.0/16

# VM configuration
vmconfig:
  master:
    replicas: 3
    cpu: 8
    ram: 24576
    disk: 120
    core: 4
  worker:
    replicas: 3  
    cpu: 24
    ram: 122880
    disk: 120
    core: 12
  infra:
    cpu: 12
    ram: 24576
    disk: 120
    core: 6
  storage:
    cpu: 10
    ram: 32768
    disk: 120
    core: 5

# Validation settings
validation:
  node_retries: 10                             # number of retries for node count check    
  node_delay: 15                           # delay between retries for node count check (in seconds)
  api_retries: 20                         # number of retries for API availability check
  api_delay: 30                         # delay between retries for API availability check (in seconds)
  installer_retries: 30                # number of retries for installer completion check
  installer_delay: 60             # delay between retries for installer completion check (in seconds)
  cluster_operators_retries: 30     # number of retries for cluster operators check
  cluster_operators_delay: 60   # delay between retries for cluster operators check (in seconds)
  expected_nodes: "{{ (vmconfig.master.replicas | default(3)) + (vmconfig.worker.replicas | default(2)) }}"



# OpenShift installer settings
# DEPRECATED - use ocp_install settings below
openshift_install:
  log_level: debug          #  (e.g. "debug | info | warn | error") (default "info")

# OpenShift install/monitoring/verification settings
ocp_install:
  log_level: debug          #  (e.g. "debug | info | warn | error") (default "info")
  monitor:
    max_wait_time: 60   # in minutes
    check_interval: 60  # in seconds
    api_timeout: 300    # in seconds (5m)
  verify:
    kubeconfig_path: "{{ install_dir }}/auth/kubeconfig"
    openshift_install_binary: "/usr/local/bin/openshift-install"




